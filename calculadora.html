<body>

<header>
<h1>📅 Calculadora da Gravidez</h1>
<p>Descubra em que semana da gestação você está.</p>

<nav>
<a href="index.html">Início</a>

<section class="hero">

<h2>Calcule sua gestação</h2>

<p>Informe a data do primeiro dia da sua última menstruação.</p>

<input id="dum" type="date">

<br><br>

<button class="botao" onclick="calcularGestacao()">Calcular</button>

<h3 id="resultado"></h3>

</section>

<footer>
<p>© 2026 Pais de Primeira</p>
</footer>

<script>
function calcularGestacao(){

const dum=document.getElementById("dum").value;

if(!dum){
document.getElementById("resultado").innerHTML="Selecione uma data.";
return;
}

const inicio=new Date(dum);
const hoje=new Date();

const dias=Math.floor((hoje-inicio)/(1000*60*60*24));

const semanas=Math.floor(dias/7);

document.getElementById("resultado").innerHTML=
"Você está aproximadamente com <b>"+semanas+" semanas</b> de gestação.";

}
</script>

</body>
</html>
