<body>

<section class="hero">

<h2>Calcule sua gestação</h2>

<p>Informe a data do primeiro dia da sua última menstruação.</p>

<input id="dum" type="date">

<br><br>

<button class="botao" onclick="calcularGestacao()">Calcular</button>

<div id="resultado" class="card" style="margin-top:30px; display:none;">
    <h3>Resultado</h3>
    
    <p id="semanas"></p>
    <p id="meses"></p>
    <p id="parto"></p>

    <div style="background:#e5e7eb;border-radius:10px;height:18px;margin-top:20px;">
        <div id="barra"
             style="background:#2563eb;height:18px;width:0%;border-radius:10px;">
        </div>
    </div>
</div>

</section>

<footer>
<p>© 2026 Pais de Primeira</p>
</footer>

<script>
function calcularGestacao(){

const dum=document.getElementById("dum").value;

if(!dum){
alert("Selecione a data da última menstruação.");
return;
}

const inicio=new Date(dum);
const hoje=new Date();

const dias=Math.floor((hoje-inicio)/(1000*60*60*24));

const semanas=Math.floor(dias/7);

const meses=(semanas/4.3).toFixed(1);

const parto=new Date(inicio);
parto.setDate(parto.getDate()+280);

document.getElementById("resultado").style.display="block";

document.getElementById("semanas").innerHTML=
"🤰 Semanas: <strong>"+semanas+"</strong>";

document.getElementById("meses").innerHTML=
"📅 Meses aproximados: <strong>"+meses+"</strong>";

document.getElementById("parto").innerHTML=
"👶 Data provável do parto: <strong>"+parto.toLocaleDateString("pt-BR")+"</strong>";

const porcentagem=Math.min((semanas/40)*100,100);

document.getElementById("barra").style.width=porcentagem+"%";

}
